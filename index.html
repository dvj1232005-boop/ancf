<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Logo Nhẹ</title>
    <style>
        /* Thiết lập biến màu để dễ dàng thay đổi khi cần */
        :root {
            --bg-color: #553427; /* Màu nền nâu đậm */
            --brand-color: #d6aa7c; /* Màu vàng cát của logo và chữ */
        }

        /* Căn giữa toàn bộ nội dung ra giữa màn hình */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
        }

        /* Khung chứa logo */
        .logo-container {
            width: 250px; /* Bạn có thể thay đổi kích thước tại đây */
            height: auto;
        }

        /* Đảm bảo SVG scale đều theo khung chứa */
        svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2)); /* Đổ bóng nhẹ cho logo có chiều sâu */
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
            
            <g fill="var(--brand-color)">
                <path d="M 50,22 C 45,30 35,31 24,28 C 38,36 62,36 76,28 C 65,31 55,30 50,22 Z" />
                <path d="M 38,37 C 32,41 23,42 16,45 L 84,45 C 77,42 68,41 62,37 C 55,42 45,42 38,37 Z" />
            </g>

            <g stroke="var(--brand-color)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 33,65 V 56.5 M 33,59.5 C 33,54 40,54 40,59.5 V 65" />
                
                <path d="M 47,65 V 50 M 47,59.5 C 47,54 54,54 54,59.5 V 65" />
                
                <path d="M 61,59.5 H 67.5 C 68,54 61,54 61,59.5 C 61,65.5 67,65.5 68,62.5" />
                
                <path d="M 63.5,68 Q 64.5,69.5 65.5,68" stroke-width="2" />
            </g>
            
        </svg>
    </div>

</body>
</html>
