<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Logo Nhẹ</title>
    <style>
        /* Thiết lập biến màu để dễ dàng thay đổi khi cần */
        :root {
            --bg-color: #553427; /* Màu nền nâu đậm */
            --brand-color: #d6aa7c; /* Màu vàng cát của logo và chữ */
        }

        /* Căn giữa toàn bộ nội dung ra giữa màn hình */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
        }

        /* Khung chứa logo */
        .logo-container {
            width: 250px; /* Bạn có thể thay đổi kích thước tại đây */
            height: auto;
        }

        /* Đảm bảo SVG scale đều theo khung chứa */
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
            
            <g fill="var(--brand-color)">
                <path d="M 50,22 C 45,30 35,31 24,28 C 38,36 62,36 76,28 C 65,31 55,30 50,22 Z" />
                <path d="M 38,37 C 32,41 23,42 16,45 L 84,45 C 77,42 68,41 62,37 C 55,42 45,42 38,37 Z" />
            </g>

            <g stroke="var(--brand-color)" stroke-width="2.2" fill="none" stroke-linecap="square" stroke-linejoin="miter">
                <path d="M 33,55 L 33,65 M 33,56.5 L 40,56.5 L 40,65" />
                
                <path d="M 47,50 L 47,65 M 47,56.5 L 54,56.5 L 54,65" />
                
                <path d="M 68,56.5 L 61,56.5 L 61,62 L 68,62 M 61,59 L 66,59" />
                
                <path d="M 62.5,66 Q 64.5,67.5 66.5,66" stroke-width="1.8" stroke-linecap="round" />
            </g>
            
        </svg>
    </div>

</body>
</html>
